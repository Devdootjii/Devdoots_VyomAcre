<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- VyomAcre — animated favicon: satellite orbiting the globe -->
  <rect width="64" height="64" rx="15" fill="#050A08"/>
  <circle cx="32" cy="33" r="17" fill="none" stroke="#00E585" stroke-width="2.4" opacity="0.85"/>
  <circle cx="32" cy="33" r="9.5" fill="none" stroke="#00E585" stroke-width="2" opacity="0.4"/>
  <circle cx="32" cy="33" r="4" fill="#00E585"/>

  <!-- orbiting satellite (counter-clockwise, 4s loop) -->
  <g>
    <circle cx="49" cy="33" r="3.6" fill="#00E585"/>
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 32 33"
      to="-360 32 33"
      dur="4s"
      repeatCount="indefinite"
    />
  </g>

  <!-- center dot soft pulse -->
  <circle cx="32" cy="33" r="4" fill="#00E585">
    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="2.4s"
      repeatCount="indefinite"
    />
  </circle>

  <!-- corner sparkles -->
  <rect x="12" y="12" width="4" height="4" rx="1" fill="#00E585" opacity="0.35"/>
  <rect x="48" y="48" width="4" height="4" rx="1" fill="#00E585" opacity="0.35"/>
</svg>
